name: Build Folium

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Clean SPM cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf .build

      - name: Patch AntiqueKit reference in project.pbxproj
        run: |
          python3 - <<'PYEOF'
          import re
          
          with open("Folium.xcodeproj/project.pbxproj", "r") as f:
              content = f.read()
          
          old_url = 'repositoryURL = "https://github.com/jarrodnorwell/AntiqueKit";'
          new_url = 'repositoryURL = "https://github.com/datlun2k11-pixel/AntiqueKit";'
          content = content.replace(old_url, new_url)
          
          old_req = '''requirement = {
                      branch = main;
                      kind = branch;
                  };'''
          new_req = '''requirement = {
                      revision = "32509aa781fa8ed87e0082932abfb46b4cf436a0";
                      kind = revision;
                  };'''
          content = content.replace(old_req, new_req)
          
          with open("Folium.xcodeproj/project.pbxproj", "w") as f:
              f.write(content)
          
          print("✅ Successfully patched AntiqueKit reference!")
          PYEOF

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Folium.xcodeproj

      - name: Archive
        run: |
          xcodebuild archive \
            -project Folium.xcodeproj \
            -scheme Folium \
            -destination generic/platform=iOS \
            -archivePath build/Folium.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

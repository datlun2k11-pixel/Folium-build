name: Build Folium

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      - name: Clean SPM cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf .build

      - name: Patch project.pbxproj
        run: |
          python3 << 'PYEOF'
          import re

          with open("Folium.xcodeproj/project.pbxproj", "r") as f:
              content = f.read()

          # AntiqueKit
          content = content.replace(
              'repositoryURL = "https://github.com/jarrodnorwell/AntiqueKit";',
              'repositoryURL = "https://github.com/datlun2k11-pixel/AntiqueKit";'
          )
          ak_pat = r'(E6A0FEEB3007EC92006FB733.*?requirement\s*=\s*\{)\s*(branch\s*=\s*main;\s*kind\s*=\s*branch;)(\s*\};)'
          ak_rep = r'\1\n                revision = "32509aa781fa8ed87e0082932abfb46b4cf436a0";\n                kind = revision;\3'
          content = re.sub(ak_pat, ak_rep, content, flags=re.DOTALL)

          # TPCircularBuffer
          content = content.replace(
              'repositoryURL = "https://github.com/jarrodnorwell/TPCircularBuffer";',
              'repositoryURL = "https://github.com/datlun2k11-pixel/TPCircularBuffer";'
          )
          tpc_pat = r'(E656E9AD3006F7FF0061EA22.*?requirement\s*=\s*\{)\s*(branch\s*=\s*master;\s*kind\s*=\s*branch;)(\s*\};)'
          tpc_rep = r'\1\n                revision = "96706f154822b7631962fdae6848dfb8930a6f3f";\n                kind = revision;\3'
          content = re.sub(tpc_pat, tpc_rep, content, flags=re.DOTALL)

          # zstd
          content = content.replace(
              'repositoryURL = "https://github.com/jarrodnorwell/zstd";',
              'repositoryURL = "https://github.com/datlun2k11-pixel/zstd";'
          )
          zstd_pat = r'(E656E9A03006F6CC0061EA22.*?requirement\s*=\s*\{)\s*(branch\s*=\s*dev;\s*kind\s*=\s*branch;)(\s*\};)'
          zstd_rep = r'\1\n                revision = "84184ea0137866207e8f08bf9a797355534f7414";\n                kind = revision;\3'
          content = re.sub(zstd_pat, zstd_rep, content, flags=re.DOTALL)

          with open("Folium.xcodeproj/project.pbxproj", "w") as f:
              f.write(content)

          print("Done patching pbxproj")
          PYEOF

      - name: Download Boost headers
        run: |
          echo "Downloading Boost 1.84 headers..."
          curl -L -o boost.tar.gz https://github.com/boostorg/boost/releases/download/boost-1.84.0/boost-1.84.0.tar.gz
          tar -xzf boost.tar.gz
          ls boost-1.84.0/libs/fusion/include/ | head -5
          echo "Boost headers ready"

      - name: Force clean SPM cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/*antiquekit*
          rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/*tpcircularbuffer*
          rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/*zstd*
          echo "Cache cleaned"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Folium.xcodeproj

      - name: Download iOS Device Platform
        run: sudo xcodebuild -downloadPlatform iOS || true

      - name: Archive for iOS Device (Release)
        run: |
          set +e
          xcodebuild archive \
            -project Folium.xcodeproj \
            -scheme Folium \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Folium.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -parallelizeTargets \
            HEADER_SEARCH_PATHS="$(PWD)/boost-1.84.0 $(PWD)/SharedDependencies/Sources/nihstro/include" \
            > build_log.txt 2>&1
          EXIT_CODE=$?
          echo "Exit code: $EXIT_CODE"
          tail -n 150 build_log.txt
          grep -iE "error:|fatal error:|failed|crash" build_log.txt || echo "No errors found in log"
          exit $EXIT_CODE

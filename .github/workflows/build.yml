name: Build Folium

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode with iOS Device Platform
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      - name: Clean SPM cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf .build

      - name: Patch project.pbxproj (URLs + Revisions)
        run: |
          python3 - <<'PYEOF'
          import re
          
          with open("Folium.xcodeproj/project.pbxproj", "r") as f:
              content = f.read()
          
          # === ANTIQUEKIT ===
          old_ak_url = 'repositoryURL = "https://github.com/jarrodnorwell/AntiqueKit";'
          new_ak_url = 'repositoryURL = "https://github.com/datlun2k11-pixel/AntiqueKit";'
          if old_ak_url in content:
              content = content.replace(old_ak_url, new_ak_url)
          
          ak_pattern = r'(E6A0FEEB3007EC92006FB733.*?requirement\s*=\s*\{)\s*(branch\s*=\s*main;\s*kind\s*=\s*branch;)(\s*\};)'
          ak_replacement = r'\1\n                revision = "32509aa781fa8ed87e0082932abfb46b4cf436a0";\n                kind = revision;\3'
          content = re.sub(ak_pattern, ak_replacement, content, flags=re.DOTALL)
          
          # === TPCIRCULARBUFFER ===
          old_tpc_url = 'repositoryURL = "https://github.com/jarrodnorwell/TPCircularBuffer";'
          new_tpc_url = 'repositoryURL = "https://github.com/datlun2k11-pixel/TPCircularBuffer";'
          if old_tpc_url in content:
              content = content.replace(old_tpc_url, new_tpc_url)
          
          tpc_pattern = r'(E656E9AD3006F7FF0061EA22.*?requirement\s*=\s*\{)\s*(branch\s*=\s*master;\s*kind\s*=\s*branch;)(\s*\};)'
          tpc_replacement = r'\1\n                revision = "96706f154822b7631962fdae6848dfb8930a6f3f";\n                kind = revision;\3'
          content = re.sub(tpc_pattern, tpc_replacement, content, flags=re.DOTALL)
          
          # === ZSTD ===
          old_zstd_url = 'repositoryURL = "https://github.com/jarrodnorwell/zstd";'
          new_zstd_url = 'repositoryURL = "https://github.com/datlun2k11-pixel/zstd";'
          if old_zstd_url in content:
              content = content.replace(old_zstd_url, new_zstd_url)
          
          zstd_pattern = r'(E656E9A03006F6CC0061EA22.*?requirement\s*=\s*\{)\s*(branch\s*=\s*dev;\s*kind\s*=\s*branch;)(\s*\};)'
          zstd_replacement = r'\1\n                revision = "84184ea0137866207e8f08bf9a797355534f7414";\n                kind = revision;\3'
          content = re.sub(zstd_pattern, zstd_replacement, content, flags=re.DOTALL)
          
          with open("Folium.xcodeproj/project.pbxproj", "w") as f:
              f.write(content)
          
          print("✅ All patches applied successfully")
          PYEOF

      - name: Force clean SPM cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/*antiquekit*
          rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/*tpcircularbuffer*
          rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/*zstd*
          find ~/Library/Caches/org.swift.swiftpm \( -name "*antiquekit*" -o -name "*tpcircularbuffer*" -o -name "*zstd*" \) -exec rm -rf {} + 2>/dev/null || true
          echo "🧹 Cache cleaned"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Folium.xcodeproj

      - name: Archive for iOS Device (Release)
        run: |
          xcodebuild archive \
            -project Folium.xcodeproj \
            -scheme Folium \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Folium.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            HEADER_SEARCH_PATHS="$(PWD)/Boost $(PWD)/SharedDependencies/Sources/nihstro/include"

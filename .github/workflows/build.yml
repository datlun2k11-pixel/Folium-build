name: Build Folium

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Clean SPM cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf .build

      - name: Patch project.pbxproj to use forked AntiqueKit
        run: |
          sed -i '' 's|https://github.com/jarrodnorwell/AntiqueKit|https://github.com/datlun2k11-pixel/AntiqueKit|g' Folium.xcodeproj/project.pbxproj
          sed -i '' 's|8fb5c19247b65ac89f5ece5601ddc210d23dd023|32509aa781fa8ed87e0082932abfb46b4cf436a0|g' Folium.xcodeproj/project.pbxproj
          grep -n "AntiqueKit" Folium.xcodeproj/project.pbxproj || echo "Không tìm thấy AntiqueKit trong pbxproj!"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Folium.xcodeproj

      - name: Archive
        run: |
          xcodebuild archive \
            -project Folium.xcodeproj \
            -scheme Folium \
            -destination generic/platform=iOS \
            -archivePath build/Folium.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

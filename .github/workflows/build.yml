name: Build Folium

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Clean SPM cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf .build

      - name: Force override AntiqueKit to fork
        run: |
          find . -name "*.pbxproj" -exec sed -i '' 's|jarrodnorwell/AntiqueKit|datlun2k11-pixel/AntiqueKit|g' {} \;
          if [ -f Package.resolved ]; then
            sed -i '' 's|jarrodnorwell/AntiqueKit|datlun2k11-pixel/AntiqueKit|g' Package.resolved
          fi

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Folium.xcodeproj

      - name: Archive
        run: |
          xcodebuild archive \
            -project Folium.xcodeproj \
            -scheme Folium \
            -destination generic/platform=iOS \
            -archivePath build/Folium.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

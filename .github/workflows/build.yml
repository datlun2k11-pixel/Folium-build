name: Build Folium

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Clean SPM cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf .build

      - name: Patch AntiqueKit reference in project.pbxproj
  run: |
    python3 - <<'PYEOF'
    with open("Folium.xcodeproj/project.pbxproj", "r") as f:
        content = f.read()
    
    # 1. Replace URL
    old_url = 'repositoryURL = "https://github.com/jarrodnorwell/AntiqueKit";'
    new_url = 'repositoryURL = "https://github.com/datlun2k11-pixel/AntiqueKit";'
    if old_url not in content:
        print("⚠️ URL already patched or different format")
    else:
        content = content.replace(old_url, new_url)
        print("✅ URL replaced")
    
    # 2. Replace branch requirement with specific revision
    # Find the AntiqueKit package reference block and modify it
    import re
    
    # Pattern to match the requirement block for AntiqueKit
    pattern = r'(E6A0FEEB3007EC92006FB733.*?requirement\s*=\s*\{)\s*(branch\s*=\s*main;\s*kind\s*=\s*branch;)(\s*\};)'
    replacement = r'\1\n                revision = "32509aa781fa8ed87e0082932abfb46b4cf436a0";\n                kind = revision;\3'
    
    new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)
    
    if new_content == content:
        print("⚠️ Requirement pattern not found, trying simpler replace...")
        # Fallback: just replace the key parts
        content = content.replace('branch = main;', 'revision = "32509aa781fa8ed87e0082932abfb46b4cf436a0";', 1)
        content = content.replace('kind = branch;', 'kind = revision;', 1)
        print("✅ Applied fallback patch")
    else:
        content = new_content
        print("✅ Requirement replaced via regex")
    
    with open("Folium.xcodeproj/project.pbxproj", "w") as f:
        f.write(content)
    
    # Final verification
    if "datlun2k11-pixel" in content and "32509aa" in content:
        print("✅ Final verification passed!")
    else:
        print("❌ Verification failed but continuing anyway...")
    PYEOF
      - name: Force clean SPM cache for antiquekit
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/antiquekit-*
          rm -rf ~/Library/Caches/org.swift.swiftpm/checkouts/antiquekit-*
          find ~/Library/Caches/org.swift.swiftpm -name "*antiquekit*" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "🧹 Cleaned all antiquekit caches"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Folium.xcodeproj

      - name: Archive
        run: |
          xcodebuild archive \
            -project Folium.xcodeproj \
            -scheme Folium \
            -destination generic/platform=iOS \
            -archivePath build/Folium.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

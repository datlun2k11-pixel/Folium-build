name: Build Folium

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      # Fix: override AntiqueKit to a commit compatible with Swift 6.1
      - name: Patch SPM dependency
        run: |
          sed -i '' 's|https://github.com/jarrodnorwell/AntiqueKit.git|https://github.com/jarrodnorwell/AntiqueKit.git|' Package.resolved || true
          # Nếu repo có Package.resolved thì sửa trực tiếp commit hash ở đó
          # Hoặc clone AntiqueKit và checkout commit cũ rồi trỏ local path
          
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Folium.xcodeproj

      - name: Archive
        run: |
          xcodebuild archive \
            -project Folium.xcodeproj \
            -scheme Folium \
            -destination generic/platform=iOS \
            -archivePath build/Folium.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

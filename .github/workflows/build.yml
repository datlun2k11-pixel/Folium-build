name: Build Folium

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      - name: Clean SPM cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf .build

      - name: Patch project.pbxproj
        run: |
          python3 << 'PYEOF'
          import re
          with open("Folium.xcodeproj/project.pbxproj", "r") as f:
              content = f.read()

          content = content.replace('repositoryURL = "https://github.com/jarrodnorwell/AntiqueKit";','repositoryURL = "https://github.com/datlun2k11-pixel/AntiqueKit";')
          content = re.sub(r'(E6A0FEEB3007EC92006FB733.*?requirement\s*=\s*\{)\s*(branch\s*=\s*main;\s*kind\s*=\s*branch;)(\s*\};)', r'\1\n                revision = "32509aa781fa8ed87e0082932abfb46b4cf436a0";\n                kind = revision;\3', content, flags=re.DOTALL)

          content = content.replace('repositoryURL = "https://github.com/jarrodnorwell/TPCircularBuffer";','repositoryURL = "https://github.com/datlun2k11-pixel/TPCircularBuffer";')
          content = re.sub(r'(E656E9AD3006F7FF0061EA22.*?requirement\s*=\s*\{)\s*(branch\s*=\s*master;\s*kind\s*=\s*branch;)(\s*\};)', r'\1\n                revision = "96706f154822b7631962fdae6848dfb8930a6f3f";\n                kind = revision;\3', content, flags=re.DOTALL)

          content = content.replace('repositoryURL = "https://github.com/jarrodnorwell/zstd";','repositoryURL = "https://github.com/datlun2k11-pixel/zstd";')
          content = re.sub(r'(E656E9A03006F6CC0061EA22.*?requirement\s*=\s*\{)\s*(branch\s*=\s*dev;\s*kind\s*=\s*branch;)(\s*\};)', r'\1\n                revision = "84184ea0137866207e8f08bf9a797355534f7414";\n                kind = revision;\3', content, flags=re.DOTALL)

          with open("Folium.xcodeproj/project.pbxproj", "w") as f:
              f.write(content)
          print("pbxproj patched")
          PYEOF

      - name: Download Boost headers and patch SharedDependencies
        run: |
          set -e
          echo "=== Downloading Boost 1.84.0 ==="
          curl -L --fail -o boost.tar.gz https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.gz
          tar -xzf boost.tar.gz

          echo "=== Verifying extracted structure ==="
          ls -d boost_1_84_0/boost || { echo "FAIL: boost/ dir missing"; exit 1; }
          test -f boost_1_84_0/boost/fusion/include/adapt_struct.hpp || { echo "FAIL: adapt_struct.hpp missing"; exit 1; }
          echo "Boost source OK"

          echo "=== Copying into nihstro ==="
          mkdir -p SharedDependencies/Sources/nihstro/boost_deps
          cp -r boost_1_84_0/boost SharedDependencies/Sources/nihstro/boost_deps/
          test -f SharedDependencies/Sources/nihstro/boost_deps/boost/fusion/include/adapt_struct.hpp || { echo "FAIL: copy failed"; exit 1; }
          echo "Boost copied into nihstro/boost_deps"

          echo "=== Patching Package.swift ==="
          python3 << 'PYEOF'
          path = "SharedDependencies/Package.swift"
          with open(path, "r") as f:
              content = f.read()

          old = '.target(name: "nihstro",\n            publicHeadersPath: "include",\n            cxxSettings: [\n                .unsafeFlags([\n                    "-I/usr/local/include"\n                ])\n            ])'
          new = '.target(name: "nihstro",\n            publicHeadersPath: "include",\n            cxxSettings: [\n                .headerSearchPath("boost_deps"),\n                .unsafeFlags([\n                    "-Iboost_deps"\n                ])\n            ])'

          if old in content:
              content = content.replace(old, new)
              print("EXACT match replaced")
          else:
              # fallback: just replace the flag string
              if '"-I/usr/local/include"' in content:
                  content = content.replace('"-I/usr/local/include"', '"-Iboost_deps"')
                  print("FALLBACK: flag string replaced")
              else:
                  print("ERROR: could not find nihstro include flag!")
                  raise SystemExit(1)

          with open(path, "w") as f:
              f.write(content)
          PYEOF

          echo "=== Verify Package.swift patched ==="
          grep -n "boost_deps" SharedDependencies/Package.swift || { echo "FAIL: Package.swift not patched"; exit 1; }
          grep -n "usr/local/include" SharedDependencies/Package.swift && { echo "FAIL: old flag still present"; exit 1; } || echo "Old flag removed OK"

      - name: Force clean SPM cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/*antiquekit*
          rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/*tpcircularbuffer*
          rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/*zstd*
          echo "Cache cleaned"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Folium.xcodeproj

      - name: Download iOS Device Platform
        run: sudo xcodebuild -downloadPlatform iOS || true

      - name: Archive for iOS Device (Release)
        run: |
          set +e
          xcodebuild archive \
            -project Folium.xcodeproj \
            -scheme Folium \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Folium.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -parallelizeTargets \
            > build_log.txt 2>&1
          EXIT_CODE=$?
          echo "Exit code: $EXIT_CODE"
          tail -n 150 build_log.txt
          grep -iE "error:|fatal error:|failed|crash" build_log.txt || echo "No errors found in log"
          exit $EXIT_CODE
